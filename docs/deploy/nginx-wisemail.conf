# Wisemail API — Nginx on OCI (backend only; SPA lives on Vercel).
# Copy to /etc/nginx/sites-available/wisemail and symlink into sites-enabled.
# Replace api.example.com; run: sudo certbot --nginx -d api.example.com

upstream wisemail_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Filled/managed by Certbot after first success:
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reject accidental SPA traffic — UI is on Vercel (APP_URL)
    location = / {
        default_type application/json;
        return 200 '{"service":"wisemail-api","ok":true}\n';
    }

    location /health {
        proxy_pass http://wisemail_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Auth, webhooks, SSE, files, actions, v1 — everything under /api
    location /api/ {
        proxy_pass http://wisemail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (/api/stream): disable buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Larger uploads (attachments via presign still go to R2; keep headroom)
        client_max_body_size 45m;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","hint":"API only — SPA is on APP_URL"}\n';
    }
}
